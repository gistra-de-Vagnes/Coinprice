services:
  - type: web
    name: crypto-realtime
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT Coinprice.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cryptodb
          property: connectionString

databases:
  - name: cryptodb
    plan: free
